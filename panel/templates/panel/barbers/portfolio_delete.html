{% extends 'panel/base.html' %}
{% block content %}
<form method="post" class="surface max-w-lg space-y-5">{% csrf_token %}<h2 class="text-lg font-bold">این نمونه‌کار از گالری حذف شود؟</h2><img src="{{ work.image.url }}" alt="{{ work.title }}" class="h-48 w-full rounded-md object-cover"><p>{{ work.title }}</p><div class="flex gap-3"><button type="submit" class="rounded-md bg-rose-700 px-4 py-2 text-white">حذف نمونه‌کار</button><a class="soft-button" href="{% url 'panel:barber_portfolio' work.barber_id %}">انصراف</a></div></form>
{% endblock %}
