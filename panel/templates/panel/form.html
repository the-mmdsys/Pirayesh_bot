{% extends 'panel/base.html' %}

{% block content %}
<form method="post" enctype="multipart/form-data" class="max-w-3xl rounded-md border border-slate-200 bg-white p-5 shadow-sm">
    {% csrf_token %}
    {% if form.non_field_errors %}
        <div class="mb-4 rounded-md border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800">
            {{ form.non_field_errors }}
        </div>
    {% endif %}
    <div class="grid gap-4 sm:grid-cols-2">
        {% include 'panel/includes/form_fields.html' %}
    </div>
    <div class="mt-6 flex flex-wrap gap-2">
        <button type="submit" class="inline-flex items-center gap-1 rounded-md bg-teal-700 px-4 py-2 text-sm font-semibold text-white transition hover:bg-teal-800">
            <i data-lucide="save" class="h-4 w-4"></i>
            ذخیره
        </button>
        <a href="{{ request.META.HTTP_REFERER|default:'../' }}" class="inline-flex items-center gap-1 rounded-md border border-slate-300 px-4 py-2 text-sm text-slate-700 transition hover:bg-slate-100">
            <i data-lucide="arrow-right" class="h-4 w-4"></i>
            بازگشت
        </a>
    </div>
</form>
{% endblock %}
