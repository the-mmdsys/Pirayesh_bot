<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} | پنل آرایشگاه</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Tahoma', 'Arial', 'sans-serif'],
                    },
                },
            },
        }
    </script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-900">
    <div class="flex min-h-screen">
        <aside class="hidden w-64 shrink-0 border-l border-slate-200 bg-white lg:block">
            <div class="border-b border-slate-200 px-5 py-5">
                <p class="text-lg font-bold">پنل آرایشگاه</p>
                <p class="mt-1 text-xs text-slate-500">{{ request.user.username }}</p>
            </div>
            <nav class="space-y-1 px-3 py-4 text-sm">
                {% include 'panel/includes/nav_links.html' %}
            </nav>
        </aside>

        <div class="flex min-w-0 flex-1 flex-col">
            <header class="border-b border-slate-200 bg-white">
                <div class="flex flex-col gap-3 px-4 py-4 sm:flex-row sm:items-center sm:justify-between lg:px-8">
                    <div>
                        <h1 class="text-xl font-bold text-slate-950">{{ title }}</h1>
                    </div>
                    <div class="flex flex-wrap items-center gap-2 text-sm">
                        <a href="{% url 'admin:index' %}" class="rounded-md border border-slate-300 px-3 py-2 text-slate-700 transition hover:bg-slate-100">Django Admin</a>
                        <a href="{% url 'admin:logout' %}" class="rounded-md bg-slate-900 px-3 py-2 text-white transition hover:bg-slate-700">خروج</a>
                    </div>
                </div>
                <nav class="flex gap-2 overflow-x-auto border-t border-slate-100 px-4 py-3 text-sm lg:hidden">
                    {% include 'panel/includes/nav_links.html' %}
                </nav>
            </header>

            <main class="flex-1 px-4 py-6 lg:px-8">
                {% if messages %}
                    <div class="mb-5 space-y-2">
                        {% for message in messages %}
                            <div class="rounded-md border border-teal-200 bg-teal-50 px-4 py-3 text-sm text-teal-900">{{ message }}</div>
                        {% endfor %}
                    </div>
                {% endif %}

                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
<script>
    if (window.lucide) {
        lucide.createIcons();
    }
</script>
</body>
</html>
